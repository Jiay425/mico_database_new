[build-system]
requires = ["setuptools>=68,<81", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "mico-agent-runtime"
version = "0.1.0"
description = "Fail-closed Python LangGraph runtime foundation for Mico"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncmy>=0.2,<1",
  "cryptography>=43,<47",
  "fastapi==0.116.1",
  "google-genai>=1,<2",
  "httpx==0.28.1",
  "langgraph==1.2.9",
  "neo4j>=5.28,<6",
  "pydantic==2.11.7",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2,<3",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
test = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0"
]

[tool.setuptools.packages.find]
include = ["mico_agent_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"
